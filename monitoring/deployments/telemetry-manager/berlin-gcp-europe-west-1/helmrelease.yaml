apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telemetry-manager
  namespace: kyma-system
spec:
  interval: 1h
  chart:
    spec:
      chart: telemetry-manager
      version: "1.74.1"
      sourceRef:
        kind: HelmRepository
        name: kyma-telemetry
        namespace: flux-system
      interval: 24h
  values:
    manager:
      container:
        image:
          # 1.74.1 with higher agent and gateway base memory, the log agent memory_limiter at 75/15,
          # and a 5Gi file_storage queue split across the gateway log exporters on a 5Gi emptyDir volume
          repository: ghcr.io/louis-kauer/telemetry-manager:1.74.1-persistence-emptyDir
          pullPolicy: "Always"
    fullnameOverride: telemetry
    default:
      enabled: false
    experimental:
      enabled: true
