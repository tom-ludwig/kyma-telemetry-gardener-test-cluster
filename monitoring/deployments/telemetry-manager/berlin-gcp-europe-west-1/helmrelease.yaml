apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: telemetry-manager
  namespace: kyma-system
spec:
  interval: 1h
  chart:
    spec:
      chart: telemetry-manager
      version: "1.74.1"
      sourceRef:
        kind: HelmRepository
        name: kyma-telemetry
        namespace: flux-system
      interval: 24h
  values:
    manager:
      container:
        image:
          # repository: ghcr.io/tom-ludwig/telemetry-manager/telemetry-manager:latest
          pullPolicy: "Always"
    fullnameOverride: telemetry
    default:
      enabled: false
    experimental:
      enabled: true
