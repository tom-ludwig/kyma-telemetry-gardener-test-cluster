apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: vt-single-test
spec:
  retentionPeriod: "7d"

  resources:
    requests:
      memory: "290Mi"
      cpu: "10m"
    limits:
      memory: "512Mi"

  storage:
    storageClassName: "default"
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
