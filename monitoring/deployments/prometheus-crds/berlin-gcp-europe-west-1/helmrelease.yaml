apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "32.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      alertmanagerconfigs:
        enabled: true
      alertmanagers:
        enabled: true
      podmonitors:
        enabled: true
      probes:
        enabled: true
      prometheusagents:
        enabled: false
      prometheuses:
        enabled: false
      prometheusrules:
        enabled: true
      scrapeconfigs:
        enabled: true
      servicemonitors:
        enabled: true
      thanosrulers:
        enabled: false
