apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-operator
      version: "0.68.1"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      limits:
        memory: "256Mi"
      requests:
        cpu: "10m"
        memory: "50Mi"

    replicaCount: 1

    crds:
      enabled: true
      plain: false
      upgrade:
        enabled: true
        forceConflicts: true

    # -- Validation Webhooks
    admissionWebhooks:
      enabled: true
      certManager:
        enabled: true

    operator:
      disable_prometheus_converter: false
      enable_converter_ownership: true

    serviceMonitor:
      enabled: true
      vm: false

    watchNamespaces: []
