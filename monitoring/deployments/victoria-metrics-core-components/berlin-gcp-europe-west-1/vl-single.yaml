apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: vl-single
spec:
  retentionPeriod: "7d"

  # pd-balanced volume: n4 nodes can only attach Hyperdisk
  nodeSelector:
    node.kubernetes.io/instance-type: n1-standard-4

  resources:
    requests:
      memory: "290Mi"
      cpu: "10m"
    limits:
      memory: "1Gi"

  storage:
    storageClassName: "default"
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
