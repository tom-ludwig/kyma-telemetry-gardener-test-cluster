apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.126.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry-helm
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    manager:
      featureGatesMap:
        operator.networkpolicy: false
        operand.networkpolicy: false
      collectorImage:
        repository: otel/opentelemetry-collector-k8s

      resources:
        limits:
          memory: "512Mi"
        requests:
          cpu: "50m"
          memory: "128Mi"

    admissionWebhooks:
      certManager:
        enabled: true
      autoGenerateCert:
        enabled: false
