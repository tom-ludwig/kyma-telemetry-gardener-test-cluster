apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loadtest
rules:
  - apiGroups: [""]
    resources: [nodes, pods, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [otelcol]
    verbs: [get]
  - apiGroups: [telemetry.kyma-project.io]
    resources: [logpipelines, metricpipelines, tracepipelines]
    verbs: [get, list, create, patch, delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loadtest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loadtest
subjects:
  - kind: ServiceAccount
    name: loadtest
    namespace: otel-load-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadtest
  namespace: otel-load-test
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [get, list, create, patch, delete, deletecollection]
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmpodscrapes]
    verbs: [get, list, create, patch, delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadtest
  namespace: otel-load-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loadtest
subjects:
  - kind: ServiceAccount
    name: loadtest
    namespace: otel-load-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadtest
  namespace: load-test-backends
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [get, list, create, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [operator.victoriametrics.com]
    resources: [vmpodscrapes]
    verbs: [list, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadtest
  namespace: kyma-system
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadtest
  namespace: kyma-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loadtest
subjects:
  - kind: ServiceAccount
    name: loadtest
    namespace: otel-load-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadtest
  namespace: load-test-backends
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loadtest
subjects:
  - kind: ServiceAccount
    name: loadtest
    namespace: otel-load-test
