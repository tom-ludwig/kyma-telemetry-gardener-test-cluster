# One Service per pipeline, so every exporter has its own endpoint.
# Per run the tool sets name, selector and port: the nop debug collector for healthy
# pipelines, the fault backend for a faulty p-000.
apiVersion: v1
kind: Service
metadata:
  name: traces-p-000
  namespace: load-test-backends
spec:
  selector:
    app: debug-backend
  ports:
    - name: http
      port: 4318
      targetPort: 4318
