apiVersion: v1
kind: ServiceAccount
metadata:
  name: otelcol
  namespace: otel-load-test
---
# Collector under test, mirroring the telemetry-manager OTLP gateway
# (internal/resources/otelcollector/testdata/otlp-gateway.yaml).
# Per run the tool sets the run label and the memory limit; the config comes from ConfigMap otelcol.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  namespace: otel-load-test
spec:
  # One collector replica pinned to the collector node; TM runs the gateway as DaemonSet
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcol
    spec:
      serviceAccountName: otelcol
      # One pod on the tainted collector node instead of TM's tolerate-all
      nodeSelector:
        load-test/role: collector
      tolerations:
        - key: load-test/role
          operator: Equal
          value: collector
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.161.0
          args:
            - --config=/conf/relay.conf
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          ports:
            - name: grpc-collector
              containerPort: 4317
            - name: http-collector
              containerPort: 4318
            - name: http-metrics
              containerPort: 8888
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # HACK: quick-fix hardcoding 4Gi; revisit later
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otelcol
            items:
              - key: relay.conf
                path: relay.conf
---
# Without TM's internalTrafficPolicy: Local, because the generators run on another node
apiVersion: v1
kind: Service
metadata:
  name: otelcol
  namespace: otel-load-test
spec:
  selector:
    app.kubernetes.io/name: otelcol
  ports:
    - name: grpc-collector
      port: 4317
      targetPort: 4317
    - name: http-collector
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: otelcol-metrics
  namespace: otel-load-test
spec:
  selector:
    app.kubernetes.io/name: otelcol
  ports:
    - name: http-metrics
      port: 8888
      targetPort: 8888
---
# Copies the run label onto every collector series
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: otelcol
  namespace: otel-load-test
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol
  podTargetLabels:
    - loadtest.kyma-project.io/run
  podMetricsEndpoints:
    - port: http-metrics
