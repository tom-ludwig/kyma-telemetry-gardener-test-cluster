# telemetrygen template. Per run the tool creates 1 Deployment per signal.
# The container runs a shell loop spawning one telemetrygen process per tenant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen-traces-0
  namespace: otel-load-test
  labels:
    app: gen-traces-0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gen-traces-0
  template:
    metadata:
      labels:
        app: gen-traces-0
    spec:
      nodeSelector:
        load-test/role: load
      containers:
        - name: telemetrygen
          image: ghcr.io/tom-ludwig/kyma-telemetry-gardener-test-cluster/telemetrygen:v0.163.0
          command: ["/bin/sh", "-c"]
          args:
            - placeholder
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              # HACK: quick-fix hardcoding 4Gi to avoid OOM when multiplexing tenants; revisit later
              memory: 4Gi
