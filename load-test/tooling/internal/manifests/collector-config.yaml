# Static part of the collector config, copied from the telemetry-manager OTLP gateway
# (internal/otelcollector/config/otlpgateway/testdata/service-enrichment-otel.yaml).
# Kyma-only processors (istio_noise_filter, istio_enrichment) are left out.
# The tool adds filter processors, exporters, connectors and pipelines per run.
extensions:
  cgroup_runtime:
    gomaxprocs:
      enabled: false
    gomemlimit:
      enabled: true
      ratio: 0.8
      refresh_interval: 30s
  health_check:
    endpoint: ${MY_POD_IP}:13133
  pprof:
    endpoint: 127.0.0.1:1777

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${MY_POD_IP}:4318
      grpc:
        endpoint: ${MY_POD_IP}:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 512
    timeout: 10s
    send_batch_max_size: 512
  k8s_attributes:
    auth_type: serviceAccount
    passthrough: false
    # No node filter: TM runs one gateway per node, here the generators run on another node.
    extract:
      metadata:
        - k8s.pod.name
        - k8s.node.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - service.namespace
        - service.name
        - service.version
        - service.instance.id
      labels:
        - from: node
          key: topology.kubernetes.io/region
          tag_name: cloud.region
        - from: node
          key: topology.kubernetes.io/zone
          tag_name: cloud.availability_zone
        - from: node
          key: node.kubernetes.io/instance-type
          tag_name: host.type
        - from: node
          key: kubernetes.io/arch
          tag_name: host.arch
      annotations:
        - from: pod
          key: resource.opentelemetry.io/service.name
          tag_name: kyma.otel.annotation.service.name
        - from: pod
          key: resource.opentelemetry.io/service.version
          tag_name: kyma.otel.annotation.service.version
      otel_annotations: true
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
  transform/drop-istio-service-enrichment:
    error_mode: ignore
    trace_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "service.*") where span.attributes["component"] == "proxy"
  transform/drop-kyma-attributes:
    error_mode: ignore
    log_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "kyma.*")
    metric_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "kyma.*")
    trace_statements:
      - statements:
          - delete_matching_keys(resource.attributes, "kyma.*")
  transform/drop-unknown-service-name:
    error_mode: ignore
    log_statements:
      - statements:
          - delete_key(resource.attributes, "service.name") where resource.attributes["service.name"] != nil and HasPrefix(resource.attributes["service.name"], "unknown_service")
    metric_statements:
      - statements:
          - delete_key(resource.attributes, "service.name") where resource.attributes["service.name"] != nil and HasPrefix(resource.attributes["service.name"], "unknown_service")
    trace_statements:
      - statements:
          - delete_key(resource.attributes, "service.name") where resource.attributes["service.name"] != nil and HasPrefix(resource.attributes["service.name"], "unknown_service")
  transform/insert-cluster-attributes:
    error_mode: ignore
    log_statements:
      - statements:
          - set(resource.attributes["k8s.cluster.name"], "${KUBERNETES_SERVICE_HOST}") where resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == ""
          - set(resource.attributes["k8s.cluster.uid"], "") where resource.attributes["k8s.cluster.uid"] == nil or resource.attributes["k8s.cluster.uid"] == ""
          - set(resource.attributes["cloud.provider"], "gcp") where resource.attributes["cloud.provider"] == nil or resource.attributes["cloud.provider"] == ""
    metric_statements:
      - statements:
          - set(resource.attributes["k8s.cluster.name"], "${KUBERNETES_SERVICE_HOST}") where resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == ""
          - set(resource.attributes["k8s.cluster.uid"], "") where resource.attributes["k8s.cluster.uid"] == nil or resource.attributes["k8s.cluster.uid"] == ""
          - set(resource.attributes["cloud.provider"], "gcp") where resource.attributes["cloud.provider"] == nil or resource.attributes["cloud.provider"] == ""
    trace_statements:
      - statements:
          - set(resource.attributes["k8s.cluster.name"], "${KUBERNETES_SERVICE_HOST}") where resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == ""
          - set(resource.attributes["k8s.cluster.uid"], "") where resource.attributes["k8s.cluster.uid"] == nil or resource.attributes["k8s.cluster.uid"] == ""
          - set(resource.attributes["cloud.provider"], "gcp") where resource.attributes["cloud.provider"] == nil or resource.attributes["cloud.provider"] == ""
  transform/restore-otel-service-attrs:
    error_mode: ignore
    log_statements:
      - statements:
          - set(resource.attributes["service.name"], resource.attributes["kyma.otel.annotation.service.name"]) where resource.attributes["kyma.otel.annotation.service.name"] != nil and resource.attributes["kyma.otel.annotation.service.name"] != ""
          - delete_key(resource.attributes, "kyma.otel.annotation.service.name")
          - set(resource.attributes["service.version"], resource.attributes["kyma.otel.annotation.service.version"]) where resource.attributes["kyma.otel.annotation.service.version"] != nil and resource.attributes["kyma.otel.annotation.service.version"] != ""
          - delete_key(resource.attributes, "kyma.otel.annotation.service.version")
    metric_statements:
      - statements:
          - set(resource.attributes["service.name"], resource.attributes["kyma.otel.annotation.service.name"]) where resource.attributes["kyma.otel.annotation.service.name"] != nil and resource.attributes["kyma.otel.annotation.service.name"] != ""
          - delete_key(resource.attributes, "kyma.otel.annotation.service.name")
          - set(resource.attributes["service.version"], resource.attributes["kyma.otel.annotation.service.version"]) where resource.attributes["kyma.otel.annotation.service.version"] != nil and resource.attributes["kyma.otel.annotation.service.version"] != ""
          - delete_key(resource.attributes, "kyma.otel.annotation.service.version")
    trace_statements:
      - statements:
          - set(resource.attributes["service.name"], resource.attributes["kyma.otel.annotation.service.name"]) where resource.attributes["kyma.otel.annotation.service.name"] != nil and resource.attributes["kyma.otel.annotation.service.name"] != ""
          - delete_key(resource.attributes, "kyma.otel.annotation.service.name")
          - set(resource.attributes["service.version"], resource.attributes["kyma.otel.annotation.service.version"]) where resource.attributes["kyma.otel.annotation.service.version"] != nil and resource.attributes["kyma.otel.annotation.service.version"] != ""
          - delete_key(resource.attributes, "kyma.otel.annotation.service.version")
  transform/set-instrumentation-scope-kyma:
    error_mode: ignore
    metric_statements:
      - statements:
          - set(scope.version, "1.0.0") where scope.name == "github.com/kyma-project/opentelemetry-collector-components/receiver/kymastatsreceiver"
          - set(scope.name, "io.kyma-project.telemetry/kyma") where scope.name == "github.com/kyma-project/opentelemetry-collector-components/receiver/kymastatsreceiver"
  transform/set-kyma-input-name-otlp:
    error_mode: ignore
    metric_statements:
      - statements:
          - set(resource.attributes["kyma.input.name"], "otlp")
  transform/set-observed-time-if-zero:
    error_mode: ignore
    log_statements:
      - statements:
          - set(log.observed_time, Now())
        conditions:
          - log.observed_time_unix_nano == 0

service:
  extensions:
    - cgroup_runtime
    - health_check
    - pprof
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${MY_POD_IP}
                port: 8888
                without_scope_info: false
                without_type_suffix: false
                without_units: false
      level: normal
    logs:
      level: info
      encoding: json
