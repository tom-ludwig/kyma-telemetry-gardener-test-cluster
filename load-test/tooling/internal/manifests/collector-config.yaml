# Static part of the collector config, copied from the telemetry-manager OTLP gateway
# (internal/otelcollector/config/otlpgateway/testdata/all-signals-multi-backend.yaml)
# The tool adds filter processors, exporters, connectors and pipelines per run.
extensions:
  cgroup_runtime:
    gomaxprocs:
      enabled: false
    gomemlimit:
      enabled: true
      ratio: 0.8
      refresh_interval: 30s
  health_check:
    endpoint: ${MY_POD_IP}:13133
  pprof:
    endpoint: 127.0.0.1:1777

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${MY_POD_IP}:4318
      grpc:
        endpoint: ${MY_POD_IP}:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 512
    timeout: 10s
    send_batch_max_size: 512

service:
  extensions:
    - cgroup_runtime
    - health_check
    - pprof
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${MY_POD_IP}
                port: 8888
                without_scope_info: false
                without_type_suffix: false
                without_units: false
      level: normal
    logs:
      level: info
      encoding: json
