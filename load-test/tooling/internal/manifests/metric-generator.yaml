# avalanche template for the metric agent. Per run the tool creates this Deployment once; the
# container runs a shell loop spawning one avalanche per tenant on its own port. The pod is
# not annotated for scraping: one annotated Service per tenant points at each port instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen-metric-agent
  namespace: otel-load-test
  labels:
    app: gen-metric-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gen-metric-agent
  template:
    metadata:
      labels:
        app: gen-metric-agent
    spec:
      automountServiceAccountToken: false
      containers:
        - name: metric-gen
          image: ghcr.io/tom-ludwig/kyma-telemetry-gardener-test-cluster/avalanche:v0.7.0
          command: ["/bin/sh", "-c"]
          args:
            - placeholder
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 4Gi