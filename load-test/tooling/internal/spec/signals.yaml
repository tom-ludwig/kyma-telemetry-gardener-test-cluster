# Per signal: the OTTL filter processor field, how items are counted in otelcol_* metrics,
# and the load A total rate. -component=all gives agentRate of the total to the agent and the
# rest to the gateway; single-component runs get the total. Unknown keys fail at start.
signals:
  - name: traces
    item: spans # otelcol_*_<item>_total
    filterKey: trace_conditions # filter processor field
    totalRate: 10000
  - name: metrics
    item: metric_points
    filterKey: metric_conditions
    totalRate: 9000
    agentRate: 7000
  - name: logs
    item: log_records
    filterKey: log_conditions
    totalRate: 6000
    agentRate: 1000
    bodyBytes: 2000 # log body size
