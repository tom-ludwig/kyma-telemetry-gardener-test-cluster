apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest
  namespace: otel-load-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: loadtest
      restartPolicy: Never
      nodeSelector:
        load-test/role: load
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadtest
          image: ghcr.io/tom-ludwig/kyma-telemetry-gardener-test-cluster/loadtest:main
          imagePullPolicy: Always
          args:
            - -target=tm # test managed Telemetry Manager gateway (F1, healthy only); default otel
            # - -component=log-agent # gateway (default), log-agent, metric-agent or all; agents and all need -target=tm
            - -shape=F1
            - -tenants=10
            - -load=A
            # - -rate=50
            - -warmup=2m
            - -steady=10m
            - -cooldown=2m
            - -skip-preflight
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 556Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
