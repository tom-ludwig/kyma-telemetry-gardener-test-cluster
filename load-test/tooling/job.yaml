apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest-file-storage
  namespace: otel-load-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: loadtest
      restartPolicy: Never
      # nodeSelector:
      #   kubernetes.io/hostname: shoot--berlin--tom-evaluation-otel-file-queue-z1-89cb9-8226r
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadtest
          image: ghcr.io/tom-ludwig/kyma-telemetry-gardener-test-cluster/loadtest:file-storage
          imagePullPolicy: Always
          args:
            - -target=tm # test managed Telemetry Manager gateway (F1, healthy only); default otel
            # - -component=log-agent # gateway (default), log-agent, metric-agent or all; agents and all need -target=tm
            # - -target=otel-fs # test managed Telemetry Manager gateway (F1, healthy only); default otel
            - -shape=F1
            - -tenants=50
            - -load=A
            - -warmup=10m
            - -steady=3m
            - -cooldown=1m
            - -skip-preflight
            - -node-selector=kubernetes.io/hostname=shoot--berlin--tom-evaluation-worker-load-z1-6747c-jh8ll
            # - -health=faulty
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 556Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
