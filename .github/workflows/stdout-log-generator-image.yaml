name: stdout-log-generator image

on:
  push:
    branches: [main]
    paths: ["load-test/stdout-log-generator/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: load-test/stdout-log-generator
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/stdout-log-generator:v20261023-ed61e465
            ghcr.io/${{ github.repository }}/stdout-log-generator:latest