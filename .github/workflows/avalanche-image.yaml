name: avalanche image

on:
  push:
    branches: [main]
    paths: ["load-test/avalanche/**", ".github/workflows/avalanche-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: load-test/avalanche
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/avalanche:v0.7.0
            ghcr.io/${{ github.repository }}/avalanche:latest