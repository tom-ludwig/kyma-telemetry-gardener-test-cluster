name: loadtest image

on:
  push:
    branches: [main]
    paths: ["load-test/tooling/**", ".github/workflows/loadtest-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: load-test/tooling/go.mod
      - name: Test
        working-directory: load-test/tooling
        run: go vet ./... && go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: load-test/tooling
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          # Only main moves the :main tag; branch builds get their commit SHA only.
          tags: |
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/loadtest:main', github.repository) || '' }}
            ghcr.io/${{ github.repository }}/loadtest:${{ github.sha }}